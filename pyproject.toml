[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polarization"
version = "0.1.0"
description = "2D simulation of polarizability in a rotating reference frame (Python port)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polarization = "polarization.__main__:main"

[tool.setuptools.packages.find]
include = ["polarization*"]
exclude = ["tests*", "examples*"]
